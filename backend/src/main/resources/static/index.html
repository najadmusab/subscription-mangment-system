<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fa">
  <title>Subscript — Subscription Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="overview">
        <span class="brand-mark">S</span>
        <span class="brand-copy"><strong>subscript</strong><small>MANAGEMENT CONSOLE</small></span>
      </a>
      <div class="workspace-switch">
        <span class="workspace-icon">B</span>
        <span><strong>Brightloop Software</strong><small>Workspace</small></span>
        <span class="chevron">⌄</span>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-item" data-page="products"><span class="nav-icon">▦</span>Products</button>
        <button class="nav-item" data-page="plans"><span class="nav-icon">▤</span>Plans</button>
        <button class="nav-item" data-page="subscriptions"><span class="nav-icon">⟳</span>Subscriptions</button>
        <div class="nav-label nav-label-spaced">FINANCE</div>
        <button class="nav-item" data-page="invoices"><span class="nav-icon">▧</span>Invoices <span class="nav-count">4</span></button>
        <button class="nav-item" data-page="payments"><span class="nav-icon">⇄</span>Payments</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">?</div><strong>Need a hand?</strong><p>Visit the help centre for setup guides and tips.</p><button id="helpBtn">Visit help centre <span>↗</span></button></div>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="profile">
          <div class="avatar">AD</div><div class="profile-copy"><strong>Alex Morgan</strong><small>Administrator</small></div><button class="more-btn" aria-label="Profile options">···</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="crumbCurrent">Overview</strong></div>
        <div class="top-actions">
          <div class="search-wrap"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search anything..." aria-label="Search anything"><kbd>⌘ K</kbd></div>
          <button class="icon-btn" id="notificationBtn" aria-label="Notifications">♧<i></i></button>
          <div class="top-avatar">AM</div>
        </div>
      </header>

      <section class="page-content" id="pageContent" aria-live="polite"></section>
      <footer class="footer"><span>© 2026 Subscript</span><span>Subscription operations, made clear.</span><span>v1.0.0</span></footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">WORKSPACE</p><h2 id="modalTitle">Create new</h2></div><button class="icon-btn close-modal" id="closeModal" aria-label="Close">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
